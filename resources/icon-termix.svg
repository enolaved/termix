<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img">
  <title>termix</title>
  <desc>A mint app tile with a dark terminal window, a split-pane seam, and the terminal prompt &gt;_</desc>
  <defs>
    <linearGradient id="base" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#7DEBBD"/>
      <stop offset="0.45" stop-color="#3DDC97"/>
      <stop offset="1" stop-color="#13A874"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141E27"/>
      <stop offset="1" stop-color="#070B0F"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A5F4D4"/>
      <stop offset="0.48" stop-color="#4CDFA3"/>
      <stop offset="1" stop-color="#28C68D"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#00170E" flood-opacity="0.30"/>
    </filter>
    <filter id="paneShadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#00170E" flood-opacity="0.9"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#base)"/>
    <rect x="102" y="102" width="820" height="820" rx="188" fill="none" stroke="#FFFFFF" stroke-opacity="0.20" stroke-width="4"/>
  </g>

  <g filter="url(#paneShadow)">
    <rect x="206" y="292" width="612" height="440" rx="56" fill="url(#pane)"/>
    <rect x="208" y="294" width="608" height="436" rx="54" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="4"/>
  </g>

  <rect x="500" y="340" width="8" height="344" rx="4" fill="url(#mint)" opacity="0.55"/>

  <path d="M302 406 L438 512 L302 618" fill="none" stroke="url(#mint)" stroke-width="62" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="544" y="578" width="182" height="62" rx="31" fill="url(#mint)"/>
</svg>
