name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version mygo.json)"

      - name: Test
        run: go test -count=1 ./...

      - name: Vet
        run: |
          go vet ./...
          go tool mygo vet .

  build:
    name: Build ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            platform: darwin/universal
            artifact: termix-macos
          - name: Windows
            os: ubuntu-latest
            platform: windows/amd64,windows/arm64
            artifact: termix-windows
          - name: Linux
            os: ubuntu-latest
            platform: linux/amd64,linux/arm64
            artifact: termix-linux
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install NSIS
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Build
        env:
          # Optional: set these repository secrets after configuring signing
          # in mygo.json. Empty secrets keep the workflow on unsigned builds.
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          MYGO_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: go tool mygo build -platform "${{ matrix.platform }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: build/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Draft GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create draft release and upload installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --draft --verify-tag \
              --title "termix $tag" \
              --generate-notes
          fi

          release_assets() {
            find release-assets -type f \
              \( -name '*.dmg' \
                 -o -name '*-setup-*.exe' \
                 -o -name '*.deb' \
                 -o -name '*.rpm' \
                 -o -name '*.tar.gz' \
                 -o -name 'update-*.json' \) \
              -print0
          }
          if [ -z "$(release_assets | tr -d '\0')" ]; then
            echo "No release assets were built." >&2
            exit 1
          fi

          release_assets | xargs -0 gh release upload "$tag" --clobber
